<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Access | Storyscapes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="auth-page">
    
    <div class="auth-bg-canvas">
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?q=80&w=2000&auto=format&fit=crop" alt="Misty Mountains" class="bg-drone-shot">
        <div class="bg-overlay"></div>
    </div>

    <div class="noise-overlay"></div>

    <div class="auth-orbital-container">
        <div class="floating-visual-frame">
            <div class="inner-frame">
                <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?q=80&w=1000&auto=format&fit=crop" id="morphing-image" alt="Travel Capture">
            </div>
            <div class="floating-badge">
                <span id="badge-text">Est. 2026</span>
            </div>
        </div>

        <div class="auth-form-shell">
            <nav class="auth-nav">
                <a href="../index.html" class="brand-link">Storyscapes.</a>
                <a href="../index.html" class="exit-link">Close</a>
            </nav>

            <div class="form-content-area">
                <div id="auth-message" class="auth-message hidden"></div>

                <div class="auth-flow-step active" id="login-step">
                    <span class="step-label">Welcome Traveler</span>
                    <h2 class="step-title">Enter your <span>narrative.</span></h2>
                    
                    <form id="login-form" class="orbital-form">
                        <div class="input-float">
                            <input type="email" id="login-email" required placeholder=" ">
                            <label>Email Address</label>
                        </div>
                        <div class="input-float">
                            <input type="password" id="login-password" required placeholder=" ">
                            <label>Password</label>
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn-primary">Sign In</button>
                            <button type="button" class="btn-ghost" onclick="toggleAuth('register')">Create Account</button>
                        </div>
                    </form>
                </div>

                <div class="auth-flow-step hidden" id="register-step">
                    <span class="step-label">New Horizons</span>
                    <h2 class="step-title">Begin a <span>new story.</span></h2>
                    
                    <form id="register-form" class="orbital-form">
                        <div class="input-float">
                            <input type="text" id="register-name" required placeholder=" ">
                            <label>Full Name</label>
                        </div>
                        <div class="input-float">
                            <input type="email" id="register-email" required placeholder=" ">
                            <label>Email Address</label>
                        </div>
                        <div class="input-float">
                            <input type="password" id="register-password" required placeholder=" ">
                            <label>Password</label>
                        </div>
                        <div class="form-footer">
                            <button type="submit" class="btn-primary">Register</button>
                            <button type="button" class="btn-ghost" onclick="toggleAuth('login')">Have an account?</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="../js/auth.js"></script>
</body>
</html>
