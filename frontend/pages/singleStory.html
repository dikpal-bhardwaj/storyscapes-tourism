<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storyscapes | Journal Entry</title>
    <link rel="stylesheet" href="../css/style.css"> 
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="ambient-glow glow-1"></div>

    <nav class="navbar" id="global-nav">
        <div class="nav-brand"><a href="../index.html" style="text-decoration:none; color:inherit;">Storyscapes.</a></div>
        <div class="nav-links">
            <a href="./destinations.html" class="nav-link">Destinations</a>
            <a href="./explore.html" class="nav-link">Stories</a>
            <a href="./profile.html" class="nav-link">Journal</a>
        </div>
        <div class="nav-actions" id="nav-actions">
            <a href="./auth.html" class="btn-primary">Sign In</a>
        </div>
    </nav>

    <div id="loader" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:var(--bg-primary); z-index:999; display:flex; justify-content:center; align-items:center; font-family:var(--font-heading); font-style:italic; font-size:1.5rem;">
        <p>Opening the journal...</p>
    </div>

    <main class="story-page" id="main-content" style="opacity: 0;">
        
        <section class="story-hero">
            <div class="story-hero-text gs-reveal">
                <div class="article-top-bar">
                    <a href="./explore.html" class="back-link">← Back to Archives</a>
                </div>
                <span class="story-destination-tag" id="story-destination"></span>
                <h1 class="story-title" id="story-title"></h1>
                <div class="story-meta">
                    <span id="story-author" class="meta-author"></span>
                    <span class="meta-divider">•</span>
                    <span id="story-date" class="meta-date"></span>
                </div>
            </div>
            
            <div class="story-hero-visual gs-reveal">
                <div class="visual-wrapper">
                    <img src="" id="story-image" alt="Journal Photo">
                </div>
            </div>
        </section>

        <section class="story-editorial">
            <div class="story-reading-container gs-reveal-up">
                <p id="story-content"></p>
                
                <div class="article-tags" id="story-tags">
                    </div>
            </div>
        </section>

    </main>

    <footer class="site-footer">
        <div class="footer-top">
            <h2 class="footer-brand">Storyscapes.</h2>
            <div class="footer-links">
                <div class="footer-col">
                    <h4>Explore</h4>
                    <a href="./destinations.html">Destinations</a>
                    <a href="./explore.html">Journals</a>
                </div>
                <div class="footer-col">
                    <h4>Company</h4>
                    <a href="./contact.html">Contact</a>
                </div>
            </div>
        </div>
        <div class="footer-bottom"><p>&copy; 2026 Storyscapes. All stories reserved.</p></div>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/singleStory.js"></script>
</body>
</html>
